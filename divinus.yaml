system:
  sensor_config: /etc/sensors/sc1035_960p.ini
  web_port: 80
  web_enable_auth: false
  web_auth_user: admin
  web_auth_pass: 12345
  web_auth_skiplocal: true
  web_enable_static: false
  isp_thread_stack_size: 16384
  venc_stream_thread_stack_size: 16384
  web_server_thread_stack_size: 65536
  time_format: "%Y-%m-%d %H:%M:%S"
  watchdog: 30

isp:
  mirror: false
  flip: false
  antiflicker: 60

osd:
  enable: false

mdns:
  enable: false

onvif:
  enable: false
  enable_auth: false
  auth_user: admin
  auth_pass: 12345

rtsp:
  enable: true
  enable_auth: false
  auth_user: admin
  auth_pass: 12345
  port: 554

record:
  enable: false
  continuous: false
  path: /mnt/sdcard/recordings
  #filename: "output.mp4"
  #segment_duration: 0
  #segment_size: 52428800

stream:
  enable: false
  udp_srcport: 5600
  dest:
    - udp://239.255.255.0:5600

night_mode:
  enable: false
  #ir_sensor_pin: 62
  check_interval_s: 10
  # Netis SEC111: IR-cut pins wired to SoC GPIO 4 and 2 (see netis-sec111.md);
  # IR LED is autonomous (photoresistor in its power circuit), no SoC pin.
  #ir_cut_pin1: 4
  #ir_cut_pin2: 2
  #ir_led_pin: 999
  pin_switch_delay_us: 150
  #adc_device: /dev/sar_adc_drv
  #adc_threshold: 128
  # [divinus-142] day/night automation:
  #   mode: auto|manual|day|night ("" = legacy behaviour)
  #   light_source: sensor = SC1035 AE state via /dev/hi_i2c (for boards WITHOUT
  #     a light sensor, e.g. .142 where ir_sensor_pin is a fake GPIO0_6 pin);
  #     gpio = legacy ir_sensor_pin input
  #   dark:   exp >= dark_exposure_min && gain_tier >= dark_gain_tier
  #   bright: exp <= bright_exposure_max && gain_tier <= bright_gain_tier
  #   switch_hold_s: min seconds between auto switches (IR-LED washout hysteresis)
  #mode: auto
  #light_source: sensor
  #dark_gain_tier: 9
  #dark_exposure_min: 600
  #bright_gain_tier: 3
  #bright_exposure_max: 200
  #switch_hold_s: 300

http_post:
  enable: false
  host: <your host>
  url: /~example/000000000000/%Y/%m/%d/%H.%M.jpg
  width: 640
  height: 360
  qfactor: 90
  interval: 60
  login: <your login>
  password: <yout pass>

audio:
  enable: false
  srate: 48000
  bitrate: 128

mp4:
  enable: true
  codec: H264
  mode: CBR
  width: 1280
  height: 960
  fps: 20
  gop: 40
  bitrate: 1024
  profile: 2

jpeg:
  enable: false
  width: 1280
  height: 960
  qfactor: 70

mjpeg:
  enable: false
  mode: CBR
  width: 1280
  height: 960
  fps: 20
  bitrate: 1024
